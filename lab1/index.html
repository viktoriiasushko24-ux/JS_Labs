<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #e2e8f0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      padding: 36px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 520px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #0f172a;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 24px;
      font-size: 15px;
    }
    .instruction-box {
      background-color: #f8fafc;
      border-left: 4px solid #3b82f6;
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }
    kbd {
      background-color: #e2e8f0;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: monospace;
      font-weight: 600;
      font-size: 13px;
    }
    .example-title {
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    pre {
      background-color: #0f172a;
      color: #38bdf8;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Лабораторна робота №1</h1>
    <p class="subtitle">Розв'язання прямокутного трикутника за допомогою JS</p>

    <div class="instruction-box">
      Натисніть <kbd>F12</kbd> (або <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>I</kbd>) та відкрийте вкладку <strong>Console</strong> для тестування функції.
    </div>

    <div class="example-title">Приклад виклику:</div>
    <pre><code>triangle(7, "leg", 18, "hypotenuse");</code></pre>
  </div>

  <script src="script.js"></script>
</body>
</html>
